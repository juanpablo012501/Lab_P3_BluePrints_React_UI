services:
  web:
    build: .
    ports:
      - '5173:4173'
    environment:
      - VITE_API_BASE_URL=http://backend:8080
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/blueprints
      SPRING_DATASOURCE_USERNAME: jp
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blueprints
      POSTGRES_USER: jp
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
